name: Weekly Discord news
run-name: "Discord news · ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}"

on:
  schedule:
    # UTC starts cover 06:00 Berlin in summer (04:00) and winter (05:00).
    # cloud_run.py rejects times before 06:00 Berlin and skips confirmed weeks.
    - cron: '0 4,5 * * 1'
    # Off-hour catch-up opportunities throughout Monday.
    - cron: '7,27,47 4-22 * * 1'
    # Temporary scheduler verification; remove after the first observed schedule event.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "check = sources only; trial = update the prepared preview; send = current week"
        required: true
        default: check
        type: choice
        options:
          - check
          - trial
          - send

permissions:
  contents: write

concurrency:
  group: discord-weekly-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run weekly delivery
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          PREVIEW_PAYLOAD: ${{ secrets.PREVIEW_PAYLOAD }}
          INITIAL_PREVIEW_STATE: ${{ secrets.INITIAL_PREVIEW_STATE }}
          ALLOW_FOREX_FACTORY_FALLBACK: 'true'
          TIMEZONE: Europe/Berlin
          POST_TIME: '06:00'
          PYTHONUTF8: '1'
        run: python -B cloud_run.py --mode "$RUN_MODE"
