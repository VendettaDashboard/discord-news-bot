name: Temporary scheduler health check
on:
  schedule:
    - cron: '*/5 * * * *'
permissions: {}
jobs:
  clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Confirm automatic GitHub trigger
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          test "$TRIGGER_EVENT" = schedule
          echo "Automatic schedule reached the runner"
